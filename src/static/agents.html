<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RelayFreeLLM Agents</title>
<link rel="stylesheet" href="/static/agents.css">
</head>
<body>
<div id="app">
  <header id="header">
    <div class="header-left">
      <button id="btn-sidebar" class="icon-btn" title="Toggle sidebar">&#9776;</button>
      <h1>RelayFreeLLM Agents</h1>
    </div>
    <div class="header-right">
      <button id="btn-theme" class="icon-btn" title="Toggle theme">&#127769;</button>
    </div>
  </header>

  <div id="main">
    <aside id="sidebar" class="closed">
      <div class="sidebar-header">
        <h2>Run History</h2>
        <button id="btn-clear-history" class="btn btn-sm btn-danger">Clear</button>
      </div>
      <div id="sidebar-search-wrap">
        <input id="sidebar-search" type="text" placeholder="Search runs..." />
      </div>
      <div id="sidebar-list">
        <div class="sidebar-empty">No runs yet</div>
      </div>
    </aside>

    <div id="sidebar-overlay" class="hidden"></div>

    <div id="results-area">
      <div id="results">
        <div id="empty-state">
          <div class="empty-icon">&#129504;</div>
          <p>Describe a task and let multiple AI experts solve it together</p>
          <p class="hint">Each expert tackles a different angle, then results are synthesized</p>
        </div>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div id="controls-row">
      <div class="control-group">
        <label for="use-case">Use Case</label>
        <select id="use-case">
          <option value="general">General</option>
          <option value="research">Research</option>
          <option value="code">Code</option>
          <option value="qa">Q&amp;A</option>
        </select>
      </div>
      <div class="control-group">
        <label for="num-experts">Experts</label>
        <input type="number" id="num-experts" min="1" max="8" value="4">
      </div>
      <div class="control-spacer"></div>
    </div>
    <div id="input-wrap">
      <textarea id="input" rows="1" placeholder="Describe your task..." enterkeyhint="send"></textarea>
      <button id="btn-run" class="btn btn-primary" title="Run">Run</button>
      <button id="btn-stop" class="btn btn-danger hidden" title="Stop">Stop</button>
    </div>
    <div id="input-footer">
      <span>Enter to run &middot; Shift+Enter for new line</span>
    </div>
  </div>
</div>

<script src="/static/agents.js"></script>
</body>
</html>
